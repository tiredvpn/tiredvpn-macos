name: TiredVPN
options:
  bundleIdPrefix: com.tiredvpn
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

packages:
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit
    from: 0.5.5

targets:
  TiredVPN:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: TiredVPN
        excludes:
          - "*.entitlements"
          - "Info.plist"
    info:
      path: TiredVPN/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiredvpn.macos
        PRODUCT_NAME: TiredVPN
        INFOPLIST_FILE: TiredVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: TiredVPN/TiredVPN.entitlements
        ENABLE_APP_SANDBOX: YES
        SWIFT_VERSION: "5.9"
        ARCHS: "arm64 x86_64"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: TiredVPNTunnel
        embed: true
      - package: TOMLKit

  TiredVPNTunnel:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: TiredVPNTunnel
        excludes:
          - "*.entitlements"
          - "Info.plist"
    info:
      path: TiredVPNTunnel/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiredvpn.macos.tunnel
        PRODUCT_NAME: TiredVPNTunnel
        INFOPLIST_FILE: TiredVPNTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: TiredVPNTunnel/TiredVPNTunnel.entitlements
        ENABLE_APP_SANDBOX: YES
        SWIFT_VERSION: "5.9"
        ARCHS: "arm64 x86_64"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: TiredVPNTunnel/TiredVPNTunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor"
        OTHER_LDFLAGS:
          - "-lresolv"
          - "$(SRCROOT)/Vendor/libtiredvpn.a"
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - package: TOMLKit

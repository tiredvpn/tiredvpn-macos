# Release pipeline: build unsigned → DMG → GitHub release.
#
# Required repository secrets: none (unsigned build).
# GITHUB_TOKEN is provided automatically for release upload.
#
# Triggered on `v*.*.*` tag push (publishes release) or workflow_dispatch
# (build only, no upload). The workflow_dispatch input `libtiredvpn_version`
# overrides Vendor/VERSION for testing against an unreleased core.
#
# NOTE: The resulting .app is unsigned. On first launch users must
# right-click → Open (or: xattr -rd com.apple.quarantine TiredVPN.app).

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      libtiredvpn_version:
        description: "Override libtiredvpn core version (default: use Vendor/VERSION)"
        required: false
        default: ""

jobs:
  build:
    name: build-dmg
    runs-on: macos-15
    timeout-minutes: 30

    env:
      LIBTIREDVPN_VERSION: ${{ github.event.inputs.libtiredvpn_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen

      - name: Fetch Go core artifact (libtiredvpn.a + .h)
        run: ./Scripts/fetch-core.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project TiredVPN.xcodeproj \
            -scheme TiredVPN \
            -configuration Release \
            -archivePath build/TiredVPN.xcarchive \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Extract .app from xcarchive
        run: |
          APP_SRC="build/TiredVPN.xcarchive/Products/Applications/TiredVPN.app"
          if [ ! -d "$APP_SRC" ]; then
            echo "ERROR: .app not found in xcarchive. Contents:"
            find build/TiredVPN.xcarchive -name "*.app" -maxdepth 4
            exit 1
          fi
          mkdir -p build/export
          cp -R "$APP_SRC" build/export/TiredVPN.app

      - name: Build DMG
        run: |
          mkdir -p build/dmg-stage
          cp -R build/export/TiredVPN.app build/dmg-stage/
          ln -s /Applications build/dmg-stage/Applications
          hdiutil create \
            -volname "TiredVPN" \
            -srcfolder build/dmg-stage \
            -ov \
            -format UDZO \
            build/TiredVPN.dmg

      - name: Upload DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TiredVPN.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Release pipeline: build unsigned → DMG → GitHub release.
#
# Required repository secrets: none (unsigned build).
# GITHUB_TOKEN is provided automatically for release upload.
#
# Triggered on `v*.*.*` tag push (publishes release) or workflow_dispatch.
#
# NOTE: The resulting .app is unsigned. On first launch users must
# right-click → Open (or: xattr -rd com.apple.quarantine TiredVPN.app).

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      core_ref:
        description: "tiredvpn-oss branch/tag/sha (default: main)"
        required: false
        default: "main"

jobs:
  build:
    name: build-dmg
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout tiredvpn-macos
        uses: actions/checkout@v4

      - name: Checkout tiredvpn-oss (Go core)
        uses: actions/checkout@v4
        with:
          repository: tiredvpn/tiredvpn
          ref: ${{ github.event.inputs.core_ref || 'main' }}
          path: tiredvpn-oss

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tiredvpn-oss/go.mod
          cache-dependency-path: tiredvpn-oss/go.sum

      - name: Build libtiredvpn.a
        working-directory: tiredvpn-oss
        run: make build-macos-lib

      - name: Copy core artifacts to Vendor/
        run: |
          cp tiredvpn-oss/build/macos/libtiredvpn.a Vendor/libtiredvpn.a
          cp tiredvpn-oss/build/macos/libtiredvpn.h Vendor/libtiredvpn.h

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project TiredVPN.xcodeproj \
            -scheme TiredVPN \
            -configuration Release \
            -archivePath build/TiredVPN.xcarchive \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Extract .app from xcarchive
        run: |
          APP_SRC="build/TiredVPN.xcarchive/Products/Applications/TiredVPN.app"
          if [ ! -d "$APP_SRC" ]; then
            echo "ERROR: .app not found in xcarchive. Contents:"
            find build/TiredVPN.xcarchive -name "*.app" -maxdepth 4
            exit 1
          fi
          mkdir -p build/export
          cp -R "$APP_SRC" build/export/TiredVPN.app

      - name: Build DMG
        run: |
          mkdir -p build/dmg-stage
          cp -R build/export/TiredVPN.app build/dmg-stage/
          ln -s /Applications build/dmg-stage/Applications
          hdiutil create \
            -volname "TiredVPN" \
            -srcfolder build/dmg-stage \
            -ov \
            -format UDZO \
            build/TiredVPN.dmg

      - name: Upload DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TiredVPN.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Release pipeline: build → sign → notarize → DMG → GitHub release.
#
# Required repository secrets:
#   APPLE_ID         — Apple ID email for notarytool
#   APP_PASSWORD     — app-specific password (appleid.apple.com → App-Specific Passwords)
#   TEAM_ID          — Apple Developer Team ID (10 chars)
#   CERT_P12_BASE64  — base64-encoded Developer ID Application .p12
#   CERT_PASSWORD    — password protecting the .p12
#   GITHUB_TOKEN     — provided automatically; used by softprops/action-gh-release
#
# Triggered on `v*.*.*` tag push (publishes release) or workflow_dispatch
# (build only, no upload). The workflow_dispatch input `libtiredvpn_version`
# overrides Vendor/VERSION for testing against an unreleased core.

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      libtiredvpn_version:
        description: "Override libtiredvpn core version (default: use Vendor/VERSION)"
        required: false
        default: ""

jobs:
  build:
    name: build-sign-notarize
    runs-on: macos-14
    timeout-minutes: 45

    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      LIBTIREDVPN_VERSION: ${{ github.event.inputs.libtiredvpn_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen create-dmg

      - name: Fetch Go core artifact (libtiredvpn.a + .h)
        run: ./Scripts/fetch-core.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import code-signing certificate
        run: ./Scripts/ci/import-cert.sh

      - name: Prepare ExportOptions.plist
        # ExportOptions.plist ships with TEAM_ID_PLACEHOLDER; CI substitutes
        # the real team id from the TEAM_ID secret before exportArchive.
        run: |
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${TEAM_ID}/g" ExportOptions.plist

      - name: Archive
        run: |
          xcodebuild \
            -project TiredVPN.xcodeproj \
            -scheme TiredVPN \
            -configuration Release \
            -archivePath build/TiredVPN.xcarchive \
            -destination "generic/platform=macOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${BUILD_KEYCHAIN}" \
            archive

      - name: Export archive
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/TiredVPN.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Notarize and staple .app
        run: ./Scripts/ci/notarize.sh build/export/TiredVPN.app

      - name: Build DMG
        run: ./Scripts/ci/build-dmg.sh build/export/TiredVPN.app build/TiredVPN.dmg

      - name: Notarize and staple DMG
        run: ./Scripts/ci/notarize.sh build/TiredVPN.dmg

      - name: Upload DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TiredVPN.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keychain
        if: always()
        run: |
          if [[ -n "${BUILD_KEYCHAIN:-}" && -f "${BUILD_KEYCHAIN}" ]]; then
            security delete-keychain "${BUILD_KEYCHAIN}" || true
          fi

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout tiredvpn-macos
        uses: actions/checkout@v4

      - name: Checkout tiredvpn-oss (Go core)
        uses: actions/checkout@v4
        with:
          repository: tiredvpn/tiredvpn
          ref: main
          path: tiredvpn-oss

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tiredvpn-oss/go.mod
          cache-dependency-path: tiredvpn-oss/go.sum

      - name: Build libtiredvpn.a (universal)
        working-directory: tiredvpn-oss
        run: |
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p build/macos
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 SDKROOT=$SDKROOT \
            go build -buildmode=c-archive -o build/macos/libtiredvpn-arm64.a ./cmd/tiredvpn/
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 SDKROOT=$SDKROOT \
            go build -buildmode=c-archive -o build/macos/libtiredvpn-amd64.a ./cmd/tiredvpn/
          lipo -create build/macos/libtiredvpn-arm64.a build/macos/libtiredvpn-amd64.a \
            -output build/macos/libtiredvpn.a
          cp build/macos/libtiredvpn-arm64.h build/macos/libtiredvpn.h

      - name: Copy core artifacts to Vendor/
        run: |
          cp tiredvpn-oss/build/macos/libtiredvpn.a Vendor/libtiredvpn.a
          cp tiredvpn-oss/build/macos/libtiredvpn.h Vendor/libtiredvpn.h

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project TiredVPN.xcodeproj \
            -scheme TiredVPN \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
